# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    build:
      context: .
    develop:
      # Define rules for watching local files
      watch:
        # Action 1: Synchronize source files instantly (sync)
        - action: sync
          path: ./src
          target: /usr/src/app/src # Target must match WORKDIR in Dockerfile
          # Ignore files that shouldn't trigger a sync or restart
          ignore:
            - node_modules/
            - dist/
            - .git/
        # Action 2: Rebuild the container if core configuration files change (rebuild)
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
        - action: rebuild
          path: tsconfig.json

    env_file:
      - .env # This tells Docker Compose to look for a file named .env in the same directory.
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://anguerran:anguerran_node@db:5432/express_ts_db_appname # 1. Now points to a dedicated data folder.
    ports:
      - 3005:3005
    depends_on:
      db:
        condition: service_healthy
      # Ensure Redis starts before the application server
      redis:
        condition: service_started
    
    volumes:
      - ./data:/usr/src/app/data 

  # Cache Service (Redis)
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    # Expose the default Redis port (6379) to the host
    ports:
      - "6379:6379"
    # volumes:
    #   # Persist database data across restarts
    #   - postgres_data:/var/lib/postgresql/data

    # 🚨 ADDING HEALTHCHECK FOR RELIABLE STARTUP 🚨
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # Use redis-cli to check connectivity
      interval: 1s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      # These variables must match the DATABASE_URL used by the server service
      POSTGRES_USER: anguerran
      POSTGRES_PASSWORD: anguerran_node
      POSTGRES_DB: express_ts_db_appname
    ports:
      # Expose port 5432 for local connection (e.g., using DBeaver or VS Code)
      - "5432:5432"
    volumes:
      # Persistent volume for database data
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# The commented out section below is an example of how to define a PostgreSQL
# database that your application can use. `depends_on` tells Docker Compose to
# start the database before your application. The `db-data` volume persists the
