# 1. NETWORKING/GENERAL
# Set Redis to run in the foreground (Docker best practice)
daemonize no

# Allows connections from any interface (important for Docker containers)
# The official Redis Docker image usually defaults to this, but it's safe to include.
bind 0.0.0.0

# 2. SECURITY (CRITICAL!)
# Set a strong password for client connections
# REPLACE 'YOUR_STRONG_PASSWORD_HERE' with an actual secure password
requirepass anguerran_node

# 3. PERSISTENCE
# Enable Append Only File (AOF) for better data durability than RDB snapshots
appendonly yes
# Sync data to disk every second (a good balance of performance and safety)
appendfsync everysec

# 4. MEMORY MANAGEMENT
# Set a maximum memory limit for the instance (e.g., 256 megabytes)
# REPLACE '256mb' with an appropriate value for your host machine
maxmemory 256mb
# Eviction policy: Remove the Least Recently Used keys with an expiration set
maxmemory-policy volatile-lru

# 5. LOGGING
# Log all activity to the standard output, which is captured by Docker logs
logfile "redis/log.txt"
loglevel notice